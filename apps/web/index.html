<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="mint">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f6" />
    <meta
      name="description"
      content="Milestone — 项目托管、里程碑交付与审核工作空间。本地演示版本。"
    />
    <title>Milestone</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('milestone.web.preferences.v1') || '{}')
        document.documentElement.dataset.theme =
          p.appearance === 'dark' ||
          (p.appearance === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
        if (['mint', 'ocean', 'amber', 'violet'].includes(p.accent))
          document.documentElement.dataset.accent = p.accent
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
